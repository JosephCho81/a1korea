<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>㈜한국에이원</title>
<meta name="description" content="㈜한국에이원 — 원자재 사업부(제강 원료 종합상사)와 소모품 사업부(니트릴 · 라텍스 글러브).">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
:root{--night:#0B0D10;--bone:#EEF0F1;--mist:#BFC4C9;--fog:#8B929A;--ember:#FF7A2A;--cobalt:#5B8DEF;--sans:'SUIT Variable',SUIT,-apple-system,'Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
@supports (height:100dvh){html,body,.stage{height:100dvh}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:24px 40px;pointer-events:none}
.logo{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.logo img{height:32px;filter:brightness(0) invert(1) opacity(.9)}
.header small{font-size:12px;color:var(--fog);font-weight:600}

.stage{position:fixed;inset:0;display:flex;flex-direction:row}
.panel{position:relative;flex:1 1 0;min-height:0;overflow:hidden;cursor:pointer;transition:flex-grow .8s cubic-bezier(.77,0,.18,1)}

.panel .gl{position:absolute;inset:0;transition:filter .6s,opacity .6s}
.raw .gl{background:radial-gradient(ellipse 90% 70% at 50% 64%,#4A2712,#1F120A 70%)}
.glove .gl{background:radial-gradient(ellipse 90% 70% at 50% 64%,#14306A,#0A1530 70%)}
.stage:has(.panel:hover) .panel:not(:hover) .gl{filter:brightness(.55) saturate(.6)}
.panel::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.raw::after{background:linear-gradient(180deg,rgba(31,18,10,.9) 0,rgba(31,18,10,.5) 30%,rgba(31,18,10,0) 44%)}
.glove::after{background:linear-gradient(180deg,rgba(10,21,48,.9) 0,rgba(10,21,48,.5) 30%,rgba(10,21,48,0) 44%)}
.divider{position:fixed;top:0;bottom:0;left:50%;width:6px;margin-left:-3px;background:var(--night);z-index:10;pointer-events:none;transition:left .8s cubic-bezier(.77,0,.18,1)}


.content{position:absolute;left:40px;right:40px;top:104px;max-width:480px;z-index:2}
.tag{font-size:13px;font-weight:700;margin-bottom:14px}
.raw .tag{color:var(--ember)}.glove .tag{color:var(--cobalt)}
h2{font-size:clamp(32px,3.6vw,56px);font-weight:800;letter-spacing:-.045em;line-height:1.1}
.more{display:grid;grid-template-rows:1fr}
.more > div{overflow:hidden}
.panel:hover .more,.panel:focus-within .more{grid-template-rows:1fr}
.sub{margin-top:16px;font-size:15px;line-height:1.7;color:var(--mist);max-width:420px;max-height:6em;transition:opacity .4s,max-height .6s,margin .6s}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.enter{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;font-size:14px;font-weight:700;border-radius:2px}
.raw .enter{background:var(--ember);color:#160800}.glove .enter{background:var(--cobalt);color:#050b1a}
.news{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.22);border-radius:2px;color:var(--mist)}
.news i{width:6px;height:6px;border-radius:50%;animation:live 1.6s ease-in-out infinite}
.raw .news i{background:var(--ember)}.glove .news i{background:var(--cobalt)}
@keyframes live{50%{opacity:.25}}
:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

@media (max-width:768px){
  .stage{flex-direction:column}
  .panel::after{background:linear-gradient(0deg,rgba(11,13,16,.96) 0,rgba(11,13,16,.75) 30%,rgba(11,13,16,0) 58%)}
  .header{padding:18px 20px}
  .content{left:20px;right:20px;top:auto;bottom:22px}
  .divider{left:0;right:0;width:auto;top:50%;bottom:auto;height:6px;margin:-3px 0 0}
  h2{font-size:clamp(26px,7.4vw,38px)}
  .more{grid-template-rows:1fr}.sub{display:none}.btns{margin-top:14px}
}
@media (prefers-reduced-motion:reduce){.panel,.divider,.more{transition:none}}
</style>
</head>
<body>
<header class="header"><div class="logo"><img src="/hub/img/a1-logo.png" alt="">㈜한국에이원</div><small>사업 부문 선택</small></header>
<div class="divider"></div>
<main class="stage">
  <section class="panel raw" data-href="https://material.a1kor.com">
    <div class="gl" id="glRaw"></div>
    <div class="content">
      <div class="tag">원자재 사업부</div>
      <h2>제강 원료<br>종합상사</h2>
      <div class="more"><div>
        <p class="sub">탈산제 · 가탄제 · 합금철 · 알루미늄 원료를 생산공장과 직접 계약해 포스코 · 현대제철 · 동국제강 · 세아베스틸에 공급합니다.</p>
        <div class="btns"><button class="enter" data-go="https://material.a1kor.com">사이트 입장 →</button><button class="news" data-go="https://news.a1kor.com"><i></i>원자재 시장 뉴스 ↗</button></div>
      </div></div>
    </div>
  </section>
  <section class="panel glove" data-href="https://glove.a1kor.com">
    <div class="gl" id="glGlove"></div>
    <div class="content">
      <div class="tag">소모품 사업부</div>
      <h2>니트릴 · 라텍스<br>글러브</h2>
      <div class="more"><div>
        <p class="sub">니트릴 · 라텍스 · 비닐 장갑을 제조사에서 직접 받아 산업용 · 의료용으로 공급합니다.</p>
        <div class="btns"><button class="enter" data-go="https://glove.a1kor.com">사이트 입장 →</button><button class="news" data-go="https://market.a1kor.com"><i></i>글러브 시장 뉴스 ↗</button></div>
      </div></div>
    </div>
  </section>
</main>

<script>
// 모바일은 3D 대신 사진 한 장씩 (가볍고 화질이 좋다)
const mob = matchMedia('(max-width: 768px)').matches;
const loadScript = src => new Promise((ok, fail) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = fail; document.head.appendChild(el); });
if (mob) {
  document.getElementById('glRaw').style.background = '#000 url(/hub/img/m-raw.jpg) center/cover';
  document.getElementById('glGlove').style.background = '#000 url(/hub/img/m-glove.jpg) center/cover';
} else {
  const T = 'https://cdn.jsdelivr.net/npm/three@0.147.0/';
  loadScript(T + 'build/three.min.js')
    .then(() => Promise.all([T + 'examples/js/utils/BufferGeometryUtils.js', T + 'examples/js/environments/RoomEnvironment.js', 'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js'].map(loadScript)))
    .then(() => Promise.all(['/main/js/steel-line.js', '/hub/js/glove-line.js'].map(loadScript)))
    .then(() => {
      // 두 라인 모두 잘리지 않고 칸 안에 통째로 보이게
      SteelLine.mount(document.getElementById('glRaw'), null, { view: { t: [6, 2, 4], size: 94, fx: 0.5, fy: 0.76 } });
      const glove = GloveLine.mount(document.getElementById('glGlove'), { view: { t: [1.2, 1.6, -0.4], size: 35, fx: 0.5, fy: 0.68 } });
      document.querySelector('.glove').addEventListener('mouseenter', () => glove.setSpeed(1.8));
      document.querySelector('.glove').addEventListener('mouseleave', () => glove.setSpeed(1));
    });
}

document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); location.href = b.dataset.go; }));
document.querySelectorAll('.panel').forEach(p => p.addEventListener('click', () => { location.href = p.dataset.href; }));
</script>
</body>
</html>
