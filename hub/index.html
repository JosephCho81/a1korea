<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>㈜한국에이원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/css/layout.css">
<link rel="stylesheet" href="/hub/css/panel.css">
<link rel="stylesheet" href="/hub/css/buttons.css">
<link rel="stylesheet" href="/hub/css/header.css">
<link rel="stylesheet" href="/hub/css/responsive.css">
</head>
<body>

<div class="flash" id="flash"></div>

<!-- 헤더 -->
<header class="header">
  <div class="header-logo">
    <img src="/hub/img/a1-logo.png" alt="㈜한국에이원">
    <div><div class="header-logo-t">㈜한국에이원</div></div>
  </div>
  <div class="header-sub">사업 부문 선택</div>
</header>

<div class="divider"></div>

<div class="stage">

  <!-- 원자재 -->
  <div class="panel panel-raw" onclick="goTo('https://material.a1kor.com')">
    <div class="panel-bg"></div>
    <div class="panel-content">
      <div class="p-tag">원자재 사업부</div>
      <h2 class="p-title">글로벌<br>원자재<br><span>트레이딩</span></h2>
      <p class="p-sub">페로합금 · 철강 원료 · 비철금속<br>제강사 · 주조사 직접 공급</p>
      <div class="p-btns">
        <button class="btn-main" onclick="event.stopPropagation();goTo('https://material.a1kor.com')">사이트 입장</button>
        <button class="btn-news" onclick="event.stopPropagation();goTo('https://news.a1kor.com')">
          <span class="btn-news-dot"></span>
          LIVE · 원자재 시장 뉴스
          <span class="btn-news-arrow">↗</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 글러브 -->
  <div class="panel panel-glove" onclick="goTo('https://glove.a1kor.com')">
    <div class="panel-bg"></div>
    <div class="panel-content">
      <div class="p-tag">소모품 사업부</div>
      <h2 class="p-title">니트릴<br>라텍스<br><span>글러브</span></h2>
      <p class="p-sub">니트릴 · 라텍스 · 비닐 장갑<br>산업용 · 의료용 소모품 공급</p>
      <div class="p-btns">
        <button class="btn-main" onclick="event.stopPropagation();goTo('https://glove.a1kor.com')">사이트 입장</button>
        <button class="btn-news" onclick="event.stopPropagation();goTo('https://market.a1kor.com')">
          <span class="btn-news-dot"></span>
          LIVE · 글러브 시장 뉴스
          <span class="btn-news-arrow">↗</span>
        </button>
      </div>
    </div>
  </div>

</div>

<div class="hint"><span>사업부를 선택하세요</span></div>

<script src="/hub/js/hub.js"></script>
</body>
</html>
